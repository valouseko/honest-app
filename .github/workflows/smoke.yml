# Zkouska spusteni: nainstaluje posledni vydanou APK do emulatoru Androidu, spusti ji a do logu vypise pad (logcat).
# Spousti se rucne (Actions > Smoke > Run workflow) nebo po vydani nove verze.
name: Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Android]
    types: [completed]

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: ["35", "36", "37.0"] # 37.0 = Android 17 (Google ho tak jmenuje v sdkmanageru)
    steps:
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Stahnout APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download -R "$GITHUB_REPOSITORY" --pattern honest.apk --dir .

      - name: Spustit v emulatoru
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r honest.apk
            adb logcat -c
            adb shell am start -W -n cz.honestlead.honest/.LauncherActivity || true
            sleep 25
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d | grep -iE "honest|AndroidRuntime|FATAL|TrustedWeb|customtabs" | tail -200 > app.txt || true
            echo "===== CRASH ====="; cat crash.txt
            echo "===== APP ====="; cat app.txt
            adb shell dumpsys activity activities | grep -iE "honest|mResumedActivity|topResumed" | head -20 || true
            if grep -q "cz.honestlead.honest" crash.txt; then echo "APPKA SPADLA"; exit 1; fi
