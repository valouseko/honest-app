# Postavi podepsanou APK a vyda ji jako GitHub Release. Staly odkaz na posledni verzi:
#   https://github.com/valouseko/honest-app/releases/latest/download/honest.apk
# Spousti se pri zmene v android/ na main, nebo rucne (Actions > Android > Run workflow).
# Podpisovy klic je jen v GitHub secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD),
# zaloha lokalne v personal-os/functions/honest-app. Bez stejneho klice se nova verze neda nainstalovat pres starou.
name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "signing/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Verze z cisla behu (vyrazy ${{ }} neumi scitat, proto v shellu).
      - name: Verze
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Podpisovy klic
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Chybi secret KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      # APK musi byt podepsana prave nasim klicem: otisk musi sedet se signing/fingerprint-sha256.txt
      # (a ten se stejnym otiskem v /.well-known/assetlinks.json na os.honestlead.cz).
      - name: Kontrola podpisu
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "Nepodepsana APK, chybi klic"; ls -R android/app/build/outputs/apk; exit 1; }
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          EXPECTED=$(tr -d ':\r\n ' < signing/fingerprint-sha256.txt | tr 'A-F' 'a-f')
          grep -q "SHA-256 digest: $EXPECTED" certs.txt || { echo "Otisk podpisu nesedi s signing/fingerprint-sha256.txt"; exit 1; }
          mkdir -p dist
          cp "$APK" dist/honest.apk
          printf '{"versionCode":%s,"versionName":"%s","apk":"https://github.com/%s/releases/latest/download/honest.apk"}\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$GITHUB_REPOSITORY" > dist/version.json
          cat dist/version.json
          ls -la dist

      - name: Vydat release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION_NAME"
          NOTES="Honest $VERSION_NAME pro Android. Instalace a navod: https://valouseko.github.io/honest-app/"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/honest.apk dist/version.json --clobber
          else
            gh release create "$TAG" dist/honest.apk dist/version.json --title "Honest $VERSION_NAME" --notes "$NOTES" --latest
          fi

      - name: Smazat klic
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
