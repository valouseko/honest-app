plugins {
    id 'com.android.application'
}

// Co appka otevira: cely Honest OS. Server podle prihlaseni posle agenturu do HonestOS 2 a klienta do jeho portalu.
// Scope = cela domena (Digital Asset Links pro os.honestlead.cz), takze prechody mezi sekcemi zustavaji v appce.
// Zmena adresy = nova APK (a nove assetlinks, kdyby se menila domena).
def host = 'os.honestlead.cz'
def launchPath = '/'

// Verzi doplni CI z cisla behu (viz .github/workflows/android.yml), lokalne 1.
def vCode = (System.getenv('VERSION_CODE') ?: '1').toInteger()
def vName = System.getenv('VERSION_NAME') ?: '1.0.0-dev'

android {
    namespace 'cz.honestlead.honest'
    compileSdk 36

    defaultConfig {
        applicationId 'cz.honestlead.honest'
        minSdk 26
        targetSdk 36
        versionCode vCode
        versionName vName

        resValue 'string', 'appName', 'Honest'
        resValue 'string', 'launcherName', 'Honest'
        resValue 'string', 'launchUrl', 'https://' + host + launchPath
        resValue 'string', 'hostName', host
        resValue 'string', 'providerAuthority', 'cz.honestlead.honest.fileprovider'
        // Kontrola nove verze nativniho obalu (jen kdyz se zmeni APK, web se aktualizuje sam).
        resValue 'string', 'updateJsonUrl', 'https://github.com/valouseko/honest-app/releases/latest/download/version.json'
        resValue 'string', 'updateApkUrl', 'https://github.com/valouseko/honest-app/releases/latest/download/honest.apk'
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 prejmenoval tridy androidbrowserhelper, ktere Android hleda podle jmena (setComponentEnabledSetting)
            // -> pad hned po spusteni ("Component class P.d does not exist"). Appka je mala, zmensovani nepotrebuje.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
